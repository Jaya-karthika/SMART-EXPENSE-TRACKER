{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm"><div class="card-body">
    <h3 class="mb-3">Sign up</h3>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        <input type="{{ field.field.widget.input_type }}" name="{{ field.html_name }}" class="form-control" {% if field.value %}value="{{ field.value }}"{% endif %} required>
        {% for err in field.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
        {% if field.help_text %}<div class="form-text">{{ field.help_text|safe }}</div>{% endif %}
      </div>
      {% endfor %}
      <button class="btn btn-primary w-100">Create account</button>
    </form>
    <p class="mt-3 mb-0">Already registered? <a href="{% url 'login' %}">Login</a></p>
  </div></div>
</div></div>
{% endblock %}
