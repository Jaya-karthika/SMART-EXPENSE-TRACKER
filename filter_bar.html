<div class="d-flex flex-wrap gap-2 mb-3">
  <div class="btn-group">
    <a href="?filter=all" class="btn btn-outline-primary {% if active == 'all' %}active{% endif %}">All</a>
    <a href="?filter=today" class="btn btn-outline-primary {% if active == 'today' %}active{% endif %}">Today</a>
    <a href="?filter=week" class="btn btn-outline-primary {% if active == 'week' %}active{% endif %}">This Week</a>
    <a href="?filter=month" class="btn btn-outline-primary {% if active == 'month' %}active{% endif %}">This Month</a>
  </div>
  <div class="ms-auto">
    <a href="{% url 'report_csv' %}?filter={{ active }}" class="btn btn-success">⬇ CSV</a>

  </div>
</div>
