{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-7">
  <div class="card shadow-sm"><div class="card-body">
    <h3 class="mb-3">{{ title }}</h3>
    <form method="post">
      {% csrf_token %}
      {% for field in form %}
      <div class="mb-3">
        <label class="form-label">{{ field.label }}</label>
        {{ field }}
        {% for err in field.errors %}<div class="text-danger small">{{ err }}</div>{% endfor %}
      </div>
      {% endfor %}
      <div class="form-text mb-3">Choose "Auto" and the category is predicted from the description (uber → Travel, pizza → Food).</div>
      <button class="btn btn-primary">Save</button>
      <a href="{% url 'expense_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
