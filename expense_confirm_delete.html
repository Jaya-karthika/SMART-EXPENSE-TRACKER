{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center"><div class="col-md-6">
  <div class="card shadow-sm border-danger"><div class="card-body">
    <h4>Delete this expense?</h4>
    <p class="mb-3"><strong>{{ expense.description }}</strong> — ₹{{ expense.amount }} on {{ expense.date }}</p>
    <form method="post">
      {% csrf_token %}
      <button class="btn btn-danger">Yes, delete</button>
      <a href="{% url 'expense_list' %}" class="btn btn-secondary">Cancel</a>
    </form>
  </div></div>
</div></div>
{% endblock %}
